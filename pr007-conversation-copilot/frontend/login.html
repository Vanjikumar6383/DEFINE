<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimad — Sign In to AI Conversation Copilot</title>
  <meta name="description" content="Sign in to your Nimad Copilot workspace. Real-time meeting intelligence, decision ledgers, and live transcription." />
  <link rel="stylesheet" href="/static/base.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --clr-primary: #3b82f6;
      --clr-bg: #030712;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      color: #f8fafc;
      background: #020617;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* ══════════════════════════════════════════════════════
       VIDEO BACKGROUND SYSTEM
    ══════════════════════════════════════════════════════ */
    .video-background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background: #020617;
      pointer-events: none;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6) saturate(1.2) contrast(1.1);
      transform: scale(1.03);
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 50% 40%,
        rgba(15, 23, 42, 0.4) 0%,
        rgba(3, 7, 18, 0.85) 60%,
        rgba(2, 6, 15, 0.98) 100%
      );
      backdrop-filter: blur(2px);
    }

    .video-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Back Link */
    .back-nav {
      position: fixed;
      top: 28px;
      left: 36px;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #ffffff;
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateX(-2px);
    }

    /* Login Card */
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      margin: auto;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      margin-bottom: 12px;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .brand-tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .auth-card {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      backdrop-filter: blur(28px);
      padding: 32px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(59, 130, 246, 0.25);
    }

    .auth-tab-bar {
      display: flex;
      background: rgba(30, 41, 59, 0.65);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .auth-tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      background: rgba(30, 41, 59, 0.95);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 1px solid rgba(147, 197, 253, 0.3);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.45);
      margin-top: 6px;
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 28px rgba(37, 99, 235, 0.65);
    }

    .btn-demo-fast {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-demo-fast:hover {
      background: rgba(16, 185, 129, 0.22);
      border-color: rgba(16, 185, 129, 0.6);
      color: #6ee7b7;
    }

    .auth-error {
      color: #f87171;
      font-size: 0.84rem;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.78rem;
      color: #64748b;
    }

    .auth-footer a {
      color: #60a5fa;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Background -->
  <div class="video-background-container">
    <video autoplay muted loop playsinline preload="auto" id="bg-video" style="display:block">
      <source src="/assets/background.mp4" type="video/mp4">
      <source src="/assets/gemini_generated_video_96cdd6a6.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="video-grid-pattern"></div>
  </div>
  <script>
    (function() {
      var v = document.getElementById('bg-video');
      if (!v) return;
      v.muted = true;
      v.defaultMuted = true;
      v.setAttribute('playsinline', '');
      var p = v.play();
      if (p !== undefined) {
        p.catch(function() {
          var unlock = function() {
            v.play().catch(function(){});
            document.removeEventListener('click', unlock);
            document.removeEventListener('touchstart', unlock);
          };
          document.addEventListener('click', unlock);
          document.addEventListener('touchstart', unlock);
        });
      }
    })();
  </script>

  <!-- Back to Landing Page -->
  <div class="back-nav">
    <a href="/" class="back-btn">
      <span>←</span>
      <span>Back to Landing Page</span>
    </a>
  </div>

  <!-- Sign In Container -->
  <div class="login-wrapper">
    <div class="brand-header">
      <div class="brand-icon">🧠</div>
      <h1 class="brand-title">Nimad Copilot</h1>
      <p class="brand-tagline">Real-time meeting intelligence & objective alignment</p>
    </div>

    <div class="auth-card">
      <div class="auth-tab-bar">
        <button id="tab-login" class="auth-tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button id="tab-register" class="auth-tab-btn" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input id="login-email" class="form-input" type="email" placeholder="demo@copilot.ai" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input id="login-password" class="form-input" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button id="btn-login-submit" class="btn-submit" type="submit">Sign In to Workspace →</button>
        <button type="button" class="btn-demo-fast" onclick="fillDemoCredentials()">
          <span>⚡ 1-Click Instant Demo Login</span>
        </button>
        <p id="login-error-msg" class="auth-error"></p>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Display Name</label>
          <input id="reg-name" class="form-input" type="text" placeholder="Sarah Chen" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input id="reg-email" class="form-input" type="email" placeholder="sarah@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password (min 8 characters)</label>
          <input id="reg-password" class="form-input" type="password" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
        </div>
        <button id="btn-reg-submit" class="btn-submit" type="submit">Create Free Account →</button>
        <p id="reg-error-msg" class="auth-error"></p>
      </form>

      <div class="auth-footer">
        Protected by privacy-by-design. <a href="/">Explore Nimad Features</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';

    // If already logged in, redirect straight to dashboard
    if (localStorage.getItem('copilot_token')) {
      window.location.href = '/dashboard';
    }

    window.switchTab = (tab) => {
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    };

    window.fillDemoCredentials = async () => {
      document.getElementById('login-email').value = 'demo@copilot.ai';
      document.getElementById('login-password').value = 'demopassword123';
      switchTab('login');
      const errEl = document.getElementById('login-error-msg');
      errEl.style.display = 'none';

      const btn = document.getElementById('btn-login-submit');
      btn.textContent = 'Signing in as Demo User…';
      try {
        const { access_token } = await api.auth.login('demo@copilot.ai', 'demopassword123');
        localStorage.setItem('copilot_token', access_token);
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = 'Login error: ' + err.message;
        errEl.style.display = 'block';
        btn.textContent = 'Sign In to Workspace →';
      }
    };

    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      const errEl = document.getElementById('login-error-msg');
      errEl.style.display = 'none';
      btn.textContent = 'Signing in…';

      try {
        const { access_token } = await api.auth.login(email, pass);
        localStorage.setItem('copilot_token', access_token);
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = err.message || 'Invalid email or password';
        errEl.style.display = 'block';
        btn.textContent = 'Sign In to Workspace →';
      }
    };

    window.handleRegister = async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-reg-submit');
      const errEl = document.getElementById('reg-error-msg');
      errEl.style.display = 'none';
      btn.textContent = 'Creating account…';

      try {
        await api.auth.register(email, name, pass);
        alert('Account created successfully! Signing in…');
        const { access_token } = await api.auth.login(email, pass);
        localStorage.setItem('copilot_token', access_token);
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = err.message || 'Registration failed';
        errEl.style.display = 'block';
        btn.textContent = 'Create Free Account →';
      }
    };
  </script>
</body>
</html>
