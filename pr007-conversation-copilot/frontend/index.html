<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Conversation Copilot — Sign In</title>
  <meta name="description" content="AI-powered real-time assistant for meetings, calls, pitches, and negotiations. Stay focused and never miss a key moment." />
  <link rel="stylesheet" href="/static/base.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

    .auth-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .auth-brand {
      text-align: center;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: var(--radius);
      font-size: 2rem;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, .15);
    }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -.03em;
      color: #ffffff;
    }
    .brand-tagline { font-size: .85rem; color: var(--clr-text-dim); margin-top: 4px; }

    .auth-card {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--clr-border);
    }
    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--clr-text-muted);
      border-bottom: 2px solid transparent;
      transition: all var(--t-fast);
      font-family: var(--font-main);
    }
    .auth-tab.active {
      color: #ffffff;
      border-bottom-color: #ffffff;
      background: #141417;
    }

    .auth-form {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .auth-form.hidden { display: none; }

    .auth-footer {
      padding: 16px 28px;
      background: var(--clr-surface-2);
      border-top: 1px solid var(--clr-border);
      font-size: .78rem;
      color: var(--clr-text-dim);
      text-align: center;
    }

    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .feature-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: .78rem;
      color: var(--clr-text-muted);
    }
    .feature-pill .icon { font-size: 1rem; }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="brand-logo">🧠</div>
      <div class="brand-name">Conversation Copilot</div>
      <p class="brand-tagline">Your objective-aware AI assistant for every conversation</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button id="tab-login"    class="auth-tab active" role="tab" aria-selected="true"  onclick="switchTab('login')">Sign In</button>
        <button id="tab-register" class="auth-tab"        role="tab" aria-selected="false" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email <span class="required">*</span></label>
          <input id="login-email" class="form-input" type="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password <span class="required">*</span></label>
          <input id="login-password" class="form-input" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button id="login-btn" class="btn btn-primary" type="submit" style="width:100%;justify-content:center">
          Sign In
        </button>
        <p id="login-error" style="color:var(--clr-rose);font-size:.82rem;text-align:center;display:none"></p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Display Name <span class="required">*</span></label>
          <input id="reg-name" class="form-input" type="text" placeholder="Jane Smith" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email <span class="required">*</span></label>
          <input id="reg-email" class="form-input" type="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
          <input id="reg-password" class="form-input" type="password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
        </div>
        <button id="register-btn" class="btn btn-primary" type="submit" style="width:100%;justify-content:center">
          Create Account
        </button>
        <p id="reg-error" style="color:var(--clr-rose);font-size:.82rem;text-align:center;display:none"></p>
      </form>

      <div class="auth-footer">
        By continuing, you agree to our privacy-by-design principles. No recording without your explicit consent.
      </div>
    </div>

    <!-- Feature pills -->
    <div class="features-grid">
      <div class="feature-pill"><span class="icon">🎯</span> Objective tracking</div>
      <div class="feature-pill"><span class="icon">💡</span> Real-time insights</div>
      <div class="feature-pill"><span class="icon">📋</span> Action items</div>
      <div class="feature-pill"><span class="icon">🔒</span> Privacy by design</div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { toast, setLoading } from '/js/components/ui.js';

    // Check if already logged in
    if (localStorage.getItem('copilot_token')) {
      window.location.href = '/dashboard';
    }

    window.switchTab = (tab) => {
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    };

    window.handleLogin = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      setLoading(btn, true, 'Signing in…');
      try {
        const { access_token } = await api.auth.login(
          document.getElementById('login-email').value,
          document.getElementById('login-password').value
        );
        localStorage.setItem('copilot_token', access_token);
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        setLoading(btn, false);
      }
    };

    window.handleRegister = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const errEl = document.getElementById('reg-error');
      errEl.style.display = 'none';
      setLoading(btn, true, 'Creating account…');
      try {
        await api.auth.register(
          document.getElementById('reg-email').value,
          document.getElementById('reg-name').value,
          document.getElementById('reg-password').value
        );
        toast('Account created! Please sign in.', 'success');
        window.switchTab('login');
        document.getElementById('login-email').value = document.getElementById('reg-email').value;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        setLoading(btn, false);
      }
    };
  </script>
</body>
</html>
