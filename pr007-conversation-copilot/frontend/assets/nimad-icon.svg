<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="white">
  <!-- N icon mark - geometric angular N shape -->
  <!-- Left vertical bar -->
  <polygon points="8,12 26,12 26,108 8,108"/>
  <!-- Left bar top-left notch -->
  <polygon points="8,12 26,12 8,0"/>
  <!-- Right vertical bar -->
  <polygon points="74,12 92,12 92,108 74,108"/>
  <!-- Right bar bottom-right notch -->
  <polygon points="74,108 92,108 92,120"/>
  <!-- Diagonal cross stroke (3 segments to create the N diagonal) -->
  <!-- Top horizontal cap -->
  <polygon points="26,12 92,12 74,30 26,30"/>
  <!-- Diagonal middle -->
  <polygon points="26,30 74,30 26,90 8,90" opacity="0.85"/>
  <!-- Bottom horizontal cap -->
  <polygon points="26,90 74,90 92,108 26,108"/>
</svg>
